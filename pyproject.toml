[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "gitscribe"
version = "0.2"
description = "LangGraph-powered command-line tool and codebase indexer"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.4.2",
    "langchain>=1.3.14",
    "langchain-core>=1.5.3",
    "langchain-groq>=1.1.3",
    "numpy>=2.5.2",
    "pathlib>=1.0.1",
    "pathspec>=1.1.1",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "ruff>=0.16.1",
    "sentence-transformers>=5.7.0",
    "typer>=0.27.1",
]

[project.scripts]
gitscribe = "gitscribe.validation.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gitscribe = ["hooks/pre-push"]
"gitscribe.core.indexer" = ["schema.sql"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", "__pycache__", "Storage", ".venv"]
fix = true

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"cli.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["gitscribe"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
