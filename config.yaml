llm:
  provider: groq
  model: openai/gpt-oss-20b
  fallback_model: openai/gpt-oss-20b
  temperature: 0.2
  max_tokens: 1000
retrieval:
  min_prs: 3
  max_prs: 10
  branch_prefix_match: true
risk_classifier:
  enabled: true
  trivial_threshold: 0.15
  structural_weight: 0.3
failure_handling:
  max_retries: 2
  retry_backoff_seconds: 2
merge_preview:
  escalate_below_confidence: high
  blast_radius_depth: 2
  worktree_cleanup: true
review:
  lint:
    enabled: true
  agentic:
    enabled: true
    max_context_tokens: 20000
    hops: 2
    sandboxed_timeout_seconds: 300
hooks:
  pre_push:
    block_on_risk: false
  merge_check:
    block_on_risk: false
  post_merge:
    auto_tag: false
    push_tag: false
  commit_msg:
    enabled: true
ignore_patterns:
- '*.lock'
- poetry.lock
validation:
  file_rules:
  - path: src/gitscribe/validation/**
    mode: agentic
  - path: '**/*.sql'
    mode: static
  enabled: true
  fail_closed: true
  fail_on:
  - critical
  - high
  block_secrets: true
  block_new_vulnerabilities: true
  deterministic:
    enabled: true
  ai:
    enabled: true
    provider: llamacpp
    model: qwen2.5-coder-3b-instruct-q4_k_m
    base_url: http://127.0.0.1:8080
    api_key_env: VALIDATION_API_KEY
    timeout_seconds: 120
    max_context_tokens: 20000
    max_output_tokens: 4096
    max_file_chars: 20000
